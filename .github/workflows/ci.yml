name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同分支的新推送取消旧的运行：CI 只关心最新一次的结果
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 只做静态检查与单测：证书、密钥、发布都不在这里，PR 无法触碰发布链。
jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flutter 版本写死：.metadata 里记录的 revision 与本机不一致，
      # 不固定版本会让「本机能过、CI 不过」变成日常。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.0
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        # --fatal-infos：让 info 级问题也拦下来，否则 lint 只是装饰
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: 构建 debug APK（用于校验装机清单）
        # Gradle 走仓库里的 wrapper（android/gradlew + wrapper.jar 已入库），
        # 这样 CI 用的 Gradle 版本与本机一致。
        run: flutter build apk --debug --target-platform android-arm64

      - name: 校验装机清单（权限与备份策略）
        # 断言对象是**打包进 APK 的清单**，不是中间产物：此前用
        # `find ... | head -1` 可能选中某个插件的合并清单，导致断言在正确
        # 代码上失败（也曾在错误代码上通过）。
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -f "$APK"
          AAPT2=$(ls -d "${ANDROID_HOME}"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n1)
          echo "使用 aapt2: $AAPT2"
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml > /tmp/manifest.txt
          cat /tmp/manifest.txt

          # 自动备份必须关闭（凭据明文存在 servers box 里）
          grep -q 'allowBackup(0x01010280)=false' /tmp/manifest.txt
          # 两个高风险冗余权限必须不在
          ! grep -q 'REQUEST_INSTALL_PACKAGES' /tmp/manifest.txt
          ! grep -q 'POST_NOTIFICATIONS' /tmp/manifest.txt
          # READ_EXTERNAL_STORAGE 必须带 maxSdkVersion（不再由插件决定）
          grep -q 'READ_EXTERNAL_STORAGE' /tmp/manifest.txt
          grep -A2 'READ_EXTERNAL_STORAGE' /tmp/manifest.txt | grep -q 'maxSdkVersion'
